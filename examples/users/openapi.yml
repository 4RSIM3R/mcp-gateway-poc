openapi: 3.1.0
info:
  title: Users API
  version: 2.0.0
  description: Customer profiles and saved addresses.
servers:
  - url: http://127.0.0.1:9002
paths:
  /users:
    get:
      operationId: searchUsers
      summary: Search users
      description: Case-insensitive substring match on name or email.
      parameters:
        - name: q
          in: query
          required: true
          description: Text to search for, at least 2 characters.
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          description: Maximum number of users to return.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Matching users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
  /users/{userId}:
    get:
      operationId: getUser
      summary: Get a user
      description: Returns a customer profile, including contact details.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{userId}/addresses:
    get:
      # No operationId on purpose; service.yaml picks it by method and path.
      summary: List a user's saved addresses
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user's addresses, possibly empty.
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: The user ID, such as usr_1.
      schema:
        type: string
  schemas:
    User:
      type: object
      required: [id, name, email, phone, tier, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        tier:
          type: string
          enum: [standard, gold]
        created_at:
          type: string
          format: date-time
    Address:
      type: object
      required: [label, line1, city, postal_code, country]
      properties:
        label:
          type: string
        line1:
          type: string
        city:
          type: string
        postal_code:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No user with that ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
